name: Java checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: javac -d build src/ClinicManager.java src/TwoThreeTree.java tests/ReviewCheck.java
      - run: java -cp build ReviewCheck
